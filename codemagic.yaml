workflows:
  loabaotien-debug:
    name: Loa Bao Tien - Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Cai Gradle 8.7
        script: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build debug APK
        script: |
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
